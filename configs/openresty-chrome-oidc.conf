# OpenResty reverse proxy for Remote Chromium (KasmVNC) with OIDC via OAuth2-Proxy
# Domain: CHROME_DOMAIN
# Backend: http://127.0.0.1:4181 (OAuth2-Proxy)
# Identity Provider: any standard OIDC Provider (e.g. Keycloak, Authing, Auth0, Dex, Authentik)
#
# Replace all CHROME_* placeholders with your values before use.
# This file is managed by apply-auth-mode.sh — do not edit directly when active.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen CHROME_HTTPS_PORT ssl http2;
    server_name CHROME_DOMAIN;

    access_log /var/log/nginx/chrome_access.log main;
    error_log  /var/log/nginx/chrome_error.log;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    # No Basic Auth here; authentication is handled by OAuth2-Proxy + OIDC Provider
    location / {
        proxy_pass http://127.0.0.1:4181/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        # OAuth2-Proxy cookies can be large; increase buffer
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
