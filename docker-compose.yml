services:
  remote-chromium:
    build:
      context: .
      dockerfile: configs/Dockerfile
    image: ${CHROME_IMAGE:-remote-chromium:latest}
    container_name: ${CHROME_CONTAINER_NAME:-remote-chromium}
    network_mode: host
    restart: unless-stopped
    shm_size: ${CHROME_SHM_SIZE:-1gb}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - CUSTOM_PORT=${KASM_HTTP_PORT:-3800}
      - CUSTOM_HTTPS_PORT=${KASM_HTTPS_PORT:-3801}
      - CHROMIUM_CDP_PORT=${CHROME_CDP_PORT:-9222}
      - CHROMIUM_CDP_PROXY_PORT=${CHROME_CDP_PROXY_PORT:-9224}
      - EXTENSIONS_DIR=/config/extensions
    volumes:
      - ${CHROME_CONFIG_DIR:-./config}:/config
      - ${CHROME_EXTENSIONS_DIR:-./extensions}:/config/extensions:ro
      - ${CHROME_POLICIES_FILE:-./configs/managed_policies.json}:/etc/chromium/policies/managed/managed_policies.json:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional: OAuth2-Proxy + OIDC Provider authentication
  # (e.g. Keycloak, Authing, Auth0, Dex, Authentik, or any standard OIDC Provider)
  # Enable with: docker compose --profile oidc up -d
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: ${OAUTH2_PROXY_CONTAINER_NAME:-oauth2-proxy-remote-chromium}
    network_mode: host
    restart: unless-stopped
    env_file:
      - ${OAUTH2_PROXY_ENV_FILE:-./configs/oauth2-proxy.env}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles:
      - oidc
